<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>CotaFlow CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg:#F5F6F9; --card:#FFFFFF; --bg-2:#FBFBFC; --ink:#12141A; --ink-soft:#5B6470; --ink-faint:#9BA1AC;
    --border:#E4E7ED; --primary:#1E3A8A; --primary-btn:#1E3A8A; --primary-soft:#E7ECFA;
    --good:#1B8F6B; --good-soft:#E4F5EE; --bad:#C23A3A; --bad-soft:#FBEAEA;
    --gold:#B8862E; --gold-soft:#FBEFD8;
    --r-sm:11px; --r-md:14px; --r-lg:18px;
    --shadow:0 1px 3px rgba(16,20,26,.06), 0 1px 2px rgba(16,20,26,.04);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0B0D12; --card:#161A22; --bg-2:#0F1217; --ink:#F2F3F5; --ink-soft:#9AA1AC; --ink-faint:#6B7280;
      --border:#242A35; --primary:#6E9AF0; --primary-btn:#3B5FC4; --primary-soft:#1C2740;
      --good:#3FCB93; --good-soft:#123226; --bad:#E5686B; --bad-soft:#3A1E20;
      --gold:#D9A94A; --gold-soft:#2E2412;
      --shadow:none;
    }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:'Inter',sans-serif; padding-bottom:80px; }
  .num{ font-variant-numeric:tabular-nums; }
  .hide{ display:none !important; }

  /* ---------- topo ---------- */
  .brandbar{ display:flex; align-items:center; gap:9px; padding:calc(16px + env(safe-area-inset-top)) 18px 14px; background:var(--bg); }
  .brandmark{ width:30px; height:30px; border-radius:9px; background:var(--primary-btn); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .brandmark svg{ width:16px; height:16px; stroke:#fff; }
  .brandname{ font-family:'Space Grotesk',sans-serif; font-size:15.5px; font-weight:700; }
  .brandname span{ color:var(--primary); }
  .brandname .tag{ font-size:10px; font-weight:700; color:var(--ink-faint); background:var(--bg-2); border:1px solid var(--border); padding:2px 7px; border-radius:100px; margin-left:6px; vertical-align:middle; }
  #authUserBadge{
    position:fixed; top:calc(14px + env(safe-area-inset-top)); right:14px; z-index:60;
    width:38px; height:38px; border-radius:50%; background:var(--card); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow); cursor:pointer;
    font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--primary);
  }

  .wrap{ padding:0 16px; max-width:520px; margin:0 auto; }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; }
  .section-title{ display:flex; justify-content:space-between; align-items:baseline; margin:20px 0 12px; }
  .section-title h2{ font-size:17px; font-weight:700; }
  .hint{ font-size:11.5px; color:var(--ink-faint); font-weight:600; }

  /* ---------- botões ---------- */
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; background:var(--ink); color:#fff; border:none; border-radius:var(--r-sm); padding:13px 16px; font-size:14.5px; font-weight:700; cursor:pointer; width:100%; font-family:'Inter',sans-serif; transition:transform .13s ease, opacity .13s ease; }
  .btn:active{ transform:scale(0.97); opacity:.9; }
  .btn.primary{ background:var(--primary-btn); }
  .btn.ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--border); }
  .btn.small{ width:auto; padding:8px 14px; font-size:12.5px; }
  .icon-btn-inline{ display:inline-flex; align-items:center; gap:6px; text-decoration:none; }
  .icon-btn-inline svg{ width:15px; height:15px; }

  /* ---------- cards ---------- */
  .card{ background:var(--card); border:1px solid var(--border); border-radius:var(--r-lg); padding:16px; margin-bottom:12px; box-shadow:var(--shadow); }

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; border:1.5px solid var(--border); border-radius:var(--r-sm); padding:11px 12px;
    font-size:16px; font-family:'Inter',sans-serif; background:var(--bg-2); color:var(--ink); font-weight:500;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--primary); background:var(--card); }

  /* ---------- simulador de consórcio ---------- */
  .sim-opts{ display:flex; gap:7px; margin-bottom:14px; }
  .sim-opt{ flex:1; text-align:center; font-size:12.5px; font-weight:700; padding:9px 6px; border-radius:var(--r-sm); border:1.5px solid var(--border); background:var(--bg-2); color:var(--ink-soft); cursor:pointer; }
  .sim-opt.active{ border-color:var(--primary); color:var(--primary); background:var(--primary-soft); }
  .sim-result{ background:var(--good-soft); border-radius:var(--r-md); padding:12px 14px; margin:6px 0 16px; }
  .sim-result .sr-row{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); font-weight:600; padding:3px 0; }
  .sim-result .sr-row b{ color:var(--ink); }
  .sim-result .sr-final{ display:flex; justify-content:space-between; font-size:15px; font-weight:700; color:var(--good); border-top:1px solid rgba(0,0,0,.08); margin-top:8px; padding-top:8px; }
  .sim-out{ width:100%; min-height:220px; border:1.5px solid var(--border); border-radius:var(--r-sm); padding:12px; font-size:12.5px; font-family:'Inter',sans-serif; background:var(--bg-2); color:var(--ink); white-space:pre-wrap; resize:vertical; }

  /* ---------- funil (kanban horizontal) ---------- */
  .funil-scroll{ display:flex; gap:12px; overflow-x:auto; padding:2px 16px 16px; scroll-snap-type:x mandatory; max-width:900px; margin:0 auto; scrollbar-width:none; -ms-overflow-style:none; }
  .funil-scroll::-webkit-scrollbar{ display:none; }
  .followup-banner{ display:flex; align-items:center; gap:10px; background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold); border-radius:14px; padding:12px 14px; margin-bottom:14px; cursor:pointer; font-size:13px; font-weight:700; transition:transform .13s ease; }
  .followup-banner:active{ transform:scale(0.98); }
  .followup-banner svg{ width:19px; height:19px; flex-shrink:0; }
  .funil-col{ flex:0 0 78%; scroll-snap-align:start; }
  @media (min-width:700px){
    .funil-col{ flex:0 0 260px; }
  }
  .funil-col-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding:8px 10px; border-radius:11px; }
  .funil-col-head .dot{ width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:7px; }
  .funil-col-head .t{ font-weight:700; font-size:13px; }
  .funil-col-head .n{ font-size:11px; font-weight:700; background:rgba(255,255,255,.55); padding:2px 8px; border-radius:100px; }
  .lead-card{ background:var(--card); border:1px solid var(--border); border-left-width:3px; border-radius:14px; padding:13px; margin-bottom:9px; cursor:pointer; transition:transform .13s ease; box-shadow:var(--shadow); touch-action:none; user-select:none; }
  .funil-col.drop-hover{ background:var(--primary-soft); border-radius:16px; outline:2px dashed var(--primary); outline-offset:-2px; }
  .lead-card:active{ transform:scale(0.97); }
  .lead-card .ln{ font-weight:700; font-size:14px; }
  .lead-card .ls{ font-size:11.5px; color:var(--ink-soft); margin-top:3px; font-weight:500; }
  .lead-card .lv{ font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:13px; color:var(--primary); margin-top:8px; }
  .lead-card .lt{ font-size:10px; color:var(--ink-faint); margin-top:6px; font-weight:600; }

  /* ---------- lista de leads ---------- */
  .lead-row{ display:flex; align-items:center; gap:12px; padding:13px 2px; border-bottom:1px solid var(--border); cursor:pointer; }
  .lead-row:last-child{ border-bottom:none; }
  .lead-row-avatar{ width:38px; height:38px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700; font-family:'Space Grotesk',sans-serif; flex-shrink:0; }
  .lead-row-body{ flex:1; min-width:0; }
  .lead-row-body .n{ font-weight:700; font-size:14px; }
  .lead-row-body .s{ font-size:11.5px; color:var(--ink-soft); font-weight:500; }
  .stage-pill{ font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; padding:3px 9px; border-radius:100px; white-space:nowrap; }

  .filter-row{ display:flex; gap:7px; margin-bottom:14px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; -ms-overflow-style:none; }
  .filter-row::-webkit-scrollbar{ display:none; }
  .chip{ white-space:nowrap; font-size:12.5px; padding:8px 13px; border-radius:100px; border:1.5px solid var(--border); background:var(--card); color:var(--ink-soft); cursor:pointer; font-weight:600; transition:transform .13s ease; }
  .chip:active{ transform:scale(0.94); }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  /* ---------- empty ---------- */
  .empty{ text-align:center; padding:40px 20px; color:var(--ink-soft); }
  .empty .empty-icon{ width:56px; height:56px; border-radius:16px; margin:0 auto 16px; background:linear-gradient(150deg, var(--primary-soft), var(--card)); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; }
  .empty svg{ width:24px; height:24px; stroke:var(--primary); }
  .empty .t{ font-weight:700; color:var(--ink); font-size:15px; margin-bottom:4px; }
  .empty .s{ font-size:12.5px; font-weight:500; max-width:34ch; margin:0 auto; line-height:1.5; }

  /* ---------- nav ---------- */
  nav.tabs{ position:fixed; bottom:0; left:0; right:0; display:flex; background:var(--card); border-top:1px solid var(--border); padding:6px 6px calc(6px + env(safe-area-inset-bottom)); z-index:50; }
  nav.tabs button{ flex:1; background:none; border:none; padding:6px 2px; font-family:'Inter',sans-serif; font-size:10.5px; font-weight:600; color:var(--ink-faint); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; }
  nav.tabs button svg{ width:21px; height:21px; }
  nav.tabs button.active{ color:var(--primary); }

  .view{ display:none; animation:fade .2s ease; }
  .view.active{ display:block; }
  @keyframes fade{ from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }

  .fab{ position:fixed; bottom:calc(78px + env(safe-area-inset-bottom)); right:18px; width:56px; height:56px; border-radius:50%; background:var(--primary-btn); color:#fff; border:none; box-shadow:0 8px 20px rgba(30,58,138,.35); display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:55; transition:transform .13s ease; }
  .fab:active{ transform:scale(0.9); }
  .fab svg{ width:24px; height:24px; }

  /* ---------- modal zoom ---------- */
  .zoom-overlay{ position:fixed; inset:0; z-index:2100; background:rgba(8,11,16,.6); backdrop-filter:blur(7px); -webkit-backdrop-filter:blur(7px); display:flex; align-items:flex-end; justify-content:center; padding:0; opacity:0; visibility:hidden; transition:opacity .22s ease; }
  .zoom-overlay.show{ opacity:1; visibility:visible; }
  .zoom-card{ background:var(--card); border-radius:22px 22px 0 0; width:100%; max-width:480px; max-height:88vh; overflow-y:auto; padding:22px 20px calc(22px + env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform .28s cubic-bezier(.22,1,.36,1); }
  .zoom-overlay.show .zoom-card{ transform:translateY(0); }
  .zoom-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .zoom-head h3{ font-size:18px; font-weight:700; }
  .close-x{ width:30px; height:30px; border-radius:50%; background:var(--bg-2); border:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft); flex-shrink:0; }
  .close-x svg{ width:15px; height:15px; }

  .note-item{ padding:10px 0; border-bottom:1px solid var(--border); }
  .note-item:last-child{ border-bottom:none; }
  .note-item .nd{ font-size:10.5px; color:var(--ink-faint); font-weight:700; margin-bottom:3px; }
  .note-item .nt{ font-size:13px; font-weight:500; line-height:1.5; }

  .zoom-row{ display:flex; justify-content:space-between; align-items:center; padding:11px 0; border-bottom:1px solid var(--border); gap:10px; }
  .zoom-row:last-child{ border-bottom:none; }
  .zoom-row .zr-name{ font-weight:700; font-size:13.5px; }
  .zoom-row .zr-sub{ font-size:11px; color:var(--ink-soft); font-weight:500; margin-top:2px; }
  .zoom-row .zr-val{ text-align:right; font-weight:700; font-size:12.5px; white-space:nowrap; }

  .toast{ position:fixed; bottom:90px; left:50%; transform:translateX(-50%) translateY(6px); background:var(--ink); color:#fff; padding:11px 18px; border-radius:100px; font-size:13px; font-weight:600; z-index:3000; opacity:0; pointer-events:none; transition:all .25s ease; box-shadow:0 8px 20px rgba(0,0,0,.2); }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .spinner{ width:26px; height:26px; border:3px solid var(--border); border-top-color:var(--primary); border-radius:50%; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  #loadingScreen{ position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; z-index:5000; }
  #loadingScreen .txt{ font-size:13px; color:var(--ink-soft); font-weight:600; }

  /* ---------- auth ---------- */
  #authScreen{ position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:24px; z-index:100; }
  #authScreen.hide{ display:none; }
  .auth-box{ width:100%; max-width:360px; }
  .auth-logo{ display:flex; align-items:center; gap:9px; margin-bottom:28px; }
  .auth-title{ font-size:22px; font-weight:700; font-family:'Space Grotesk',sans-serif; margin-bottom:6px; }
  .auth-sub{ font-size:13px; color:var(--ink-soft); margin-bottom:20px; font-weight:500; }
  .auth-error{ background:var(--bad-soft); color:var(--bad); font-size:12.5px; font-weight:600; padding:10px 12px; border-radius:10px; margin-bottom:14px; display:none; }
  .auth-error.show{ display:block; }
</style>
</head>
<body>

<div id="loadingScreen">
  <div class="spinner"></div>
  <div class="txt">Carregando…</div>
</div>

<div id="authScreen" class="hide">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
      <div class="brandname">Cota<span>Flow</span> <span class="tag">CRM</span></div>
    </div>
    <div class="auth-title">Entrar</div>
    <div class="auth-sub">Use o mesmo login do app CotaFlow.</div>
    <div class="auth-error" id="authError"></div>
    <div class="field"><label>E-mail</label><input type="email" id="authEmail" placeholder="voce@email.com" autocomplete="email"></div>
    <div class="field"><label>Senha</label><input type="password" id="authPassword" placeholder="••••••••" autocomplete="current-password"></div>
    <button class="btn primary" onclick="submitAuth()">Entrar</button>
  </div>
</div>

<div id="appRoot" style="display:none;">

<div class="brandbar">
  <div class="brandmark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
  <div class="brandname">Cota<span>Flow</span> <span class="tag">CRM</span></div>
</div>
<div id="authUserBadge">?</div>

<main>
  <!-- ===================== FUNIL ===================== -->
  <section class="view active" id="view-funil">
    <div class="wrap">
      <div class="section-title"><h2>Funil de vendas</h2><span class="hint" id="funilTotal"></span></div>
      <div class="followup-banner" id="followupBanner" style="display:none;" onclick="showFollowupsModal()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span id="followupBannerText"></span>
      </div>
    </div>
    <div class="funil-scroll" id="funilScroll"></div>
  </section>

  <!-- ===================== LEADS (lista) ===================== -->
  <section class="view" id="view-leads">
    <div class="wrap">
      <div class="section-title"><h2>Meus leads</h2><span class="hint" id="leadsCount"></span></div>
      <div class="filter-row" id="leadsFilterRow"></div>
      <div class="card" style="padding:6px 16px;" id="leadsListCard"></div>
    </div>
  </section>

  <!-- ===================== EQUIPE (admin) ===================== -->
  <section class="view" id="view-equipe">
    <div class="wrap">
      <div class="section-title"><h2>Equipe</h2></div>
      <button class="btn ghost" onclick="loadTeamLeads()" style="margin-bottom:14px;">↻ Atualizar</button>
      <div id="equipeLeadsCard"></div>
    </div>
  </section>
</main>

<button class="fab" onclick="openLeadForm()">
  <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<nav class="tabs">
  <button class="tab-btn active" data-tab="funil" onclick="switchTab('funil')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg>
    Funil
  </button>
  <button class="tab-btn" data-tab="leads" onclick="switchTab('leads')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
    Leads
  </button>
  <button class="tab-btn" data-tab="equipe" onclick="switchTab('equipe')" id="navEquipe" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
    Equipe
  </button>
</nav>

</div>

<!-- ===== MODAL: novo lead / editar lead ===== -->
<div class="zoom-overlay" id="leadFormOverlay" onclick="if(event.target===this) closeZoom('leadFormOverlay')">
  <div class="zoom-card">
    <div class="zoom-head"><h3 id="leadFormTitle">Novo lead</h3><button class="close-x" onclick="closeZoom('leadFormOverlay')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div id="colarFormularioWrap" style="margin-bottom:16px;">
      <button type="button" class="btn ghost small icon-btn-inline" onclick="toggleColarFormulario()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12h6m-6 4h6M9 8h1M5 21h14a2 2 0 0 0 2-2V7l-5-5H5a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2Z"/></svg>Colar formulário</button>
      <div id="colarFormularioBox" class="hide" style="margin-top:10px;">
        <textarea id="colarFormularioTexto" rows="8" style="width:100%; border:1.5px solid var(--border); border-radius:var(--r-sm); padding:10px 12px; font-size:13px; font-family:'Inter',sans-serif; background:var(--bg-2); color:var(--ink);" placeholder="Cole aqui o texto do formulário recebido no WhatsApp"></textarea>
        <button type="button" class="btn primary small" style="margin-top:8px;" onclick="preencherDoFormulario()">Preencher automaticamente</button>
      </div>
    </div>
    <input type="hidden" id="leadId">
    <div class="field"><label>Nome</label><input type="text" id="leadNome" placeholder="Nome do cliente"></div>
    <div class="field"><label>Telefone / WhatsApp</label><input type="tel" id="leadTelefone" placeholder="(11) 99999-9999"></div>
    <div class="field"><label>E-mail (opcional)</label><input type="email" id="leadEmail" placeholder="cliente@email.com"></div>
    <div class="field"><label>Interesse (marca, modelo, produto)</label><input type="text" id="leadInteresse" placeholder="Ex: Consórcio Chevrolet Onix"></div>
    <div class="field"><label>Marca / administradora (pra virar venda depois)</label><select id="leadMarca"><option value="">Selecione…</option></select></div>
    <div class="field"><label>Valor estimado (R$)</label><input type="number" step="0.01" id="leadValor" placeholder="0,00"></div>
    <div class="field"><label>Próximo follow-up</label><input type="datetime-local" id="leadFollowup"></div>

  for(let i=0;i<(name||'').length;i++) hash = name.charCodeAt(i) + ((hash<<5)-hash);

function estimarValorDeFaixa(texto){
  if(!texto) return 0;
  const nums = (texto.match(/[\d.,]+/g) || []).map(n => parseFloat(n.replace(/\./g,'').replace(',','.')));
  if(nums.length===0) return 0;
  const mult = /mil/i.test(texto) ? 1000 : 1;
  const valores = nums.map(n => n*mult);
  return valores.length===1 ? valores[0] : (valores[0]+valores[1])/2;
}

function formatarExtras(extras){
  if(!extras || extras.length===0) return '';
  return extras.map(([k,v]) => `${k}: ${v}`).join('\n');
}

function parseFormularioTexto(texto){
  const linhas = texto.split('\n').map(l=>l.trim()).filter(l=>l.length>0);
  const pares = [];
  for(let i=0; i<linhas.length-1; i+=2){
    pares.push([linhas[i], linhas[i+1]]);
  }

  const campos = { nome:'', telefone:'', email:'', interesse:'', valorEstimado:0 };
  const extras = [];
  let faixaVeiculoTexto = '';

  pares.forEach(([pergunta, resposta])=>{
    const p = pergunta.toLowerCase();
    if(p.includes('full name') || p.includes('nome completo') || p==='nome'){
      campos.nome = resposta;
    } else if(p.includes('whatsapp') || p.includes('telefone') || p.includes('phone')){
      campos.telefone = resposta;
    } else if(p.includes('e-mail') || p.includes('email')){
      campos.email = resposta;
    } else if(p.includes('cidade') || p.includes('city')){
      extras.push(['Cidade', resposta]);
    } else if(p.includes('cargo') || p.includes('job title') || p.includes('profiss')){
      extras.push(['Cargo', resposta]);
    } else if(p.includes('pretende comprar') || p.includes('quando você') || p.includes('quando voce')){
      extras.push(['Prazo de compra', resposta]);
    } else if(p.includes('valor do ve')){
      faixaVeiculoTexto = resposta;
      extras.push(['Faixa de veículo buscada', resposta]);
    } else if(p.includes('renda')){
      extras.push(['Renda mensal', resposta]);
    } else if(p.includes('recurso') && p.includes('lance')){
      extras.push(['Recurso para lance', resposta]);
    } else if(p.includes('parcela')){
      extras.push(['Orçamento de parcela', resposta]);
    } else if(p.includes('ciente') || p.includes('consórcio') || p.includes('consorcio')){
      extras.push(['Consciência sobre consórcio', resposta]);
    } else {
      extras.push([pergunta, resposta]);
    }
  });

  campos.interesse = faixaVeiculoTexto ? ('Consórcio — faixa ' + faixaVeiculoTexto) : '';
  campos.valorEstimado = estimarValorDeFaixa(faixaVeiculoTexto);

  return { campos, extras };
}

function preencherDoFormulario(){
  const texto = document.getElementById('colarFormularioTexto').value.trim();
  if(!texto){ showToast('Cole o texto do formulário primeiro'); return; }
  const { campos, extras } = parseFormularioTexto(texto);

  if(campos.nome) document.getElementById('leadNome').value = campos.nome;
  if(campos.telefone) document.getElementById('leadTelefone').value = campos.telefone;
  if(campos.email) document.getElementById('leadEmail').value = campos.email;
  if(campos.interesse) document.getElementById('leadInteresse').value = campos.interesse;
  if(campos.valorEstimado) document.getElementById('leadValor').value = campos.valorEstimado;

  window._leadFormExtras = extras;
  document.getElementById('colarFormularioBox').classList.add('hide');
  showToast('Campos preenchidos — confira antes de salvar');
}

async function saveLead(){
  const nome = document.getElementById('leadNome').value.trim();
  if(!nome){ showToast('Digite o nome do lead'); return; }
  const id = document.getElementById('leadId').value;
  const payload = {
    nome,
    telefone: document.getElementById('leadTelefone').value.trim(),
    email: document.getElementById('leadEmail').value.trim(),
    interesse: document.getElementById('leadInteresse').value.trim(),
    marca: document.getElementById('leadMarca').value,
    valorEstimado: parseFloat(document.getElementById('leadValor').value) || 0,
    proximoContato: document.getElementById('leadFollowup').value || null,
    atualizadoEm: new Date().toISOString()
  };
  try{
    if(id){
      await db.collection('leads').doc(id).set(payload, {merge:true});
    } else {
      payload.ownerId = currentUser.uid;
      payload.companyId = companyId;
      payload.estagio = 'novo';
      payload.criadoEm = new Date().toISOString();
      payload.notas = [];
      if(window._leadFormExtras && window._leadFormExtras.length){
        payload.notas.push({ data: new Date().toISOString(), texto: 'Dados do formulário:\n' + formatarExtras(window._leadFormExtras) });
      }
      await db.collection('leads').add(payload);
      window._leadFormExtras = null;
    }
    closeZoom('leadFormOverlay');
    showToast('Lead salvo!');
    loadLeads();
  }catch(e){
    showToast('Erro ao salvar: ' + e.message);
  }
}

async function moverEstagio(leadId, novoEstagio){
  try{
    await db.collection('leads').doc(leadId).set({ estagio: novoEstagio, atualizadoEm: new Date().toISOString() }, {merge:true});
    showToast('Lead movido para "' + ESTAGIOS.find(e=>e.key===novoEstagio).nome + '"');
    closeZoom('leadDetailOverlay');
    await loadLeads();
    if(novoEstagio === 'ganho'){
      abrirConfirmacaoConversao(leadId);
    }
  }catch(e){
    showToast('Erro: ' + e.message);
  }
}

function abrirConfirmacaoConversao(leadId){
  const lead = leads.find(l=>l.id===leadId) || (window._teamLeadsCache||[]).find(l=>l.id===leadId);
  if(!lead) return;
  document.getElementById('convertLeadId').value = leadId;
  document.getElementById('convertLeadNome').textContent = lead.nome;

async function confirmarConversao(){
  const leadId = document.getElementById('convertLeadId').value;
  const marca = document.getElementById('convertMarca').value;
  const valor = parseFloat(document.getElementById('convertValor').value);
  const data = document.getElementById('convertData').value;
  if(!marca){ showToast('Escolha a marca/administradora'); return; }
  if(!valor || valor <= 0){ showToast('Digite o valor da venda'); return; }
  const lead = leads.find(l=>l.id===leadId) || (window._teamLeadsCache||[]).find(l=>l.id===leadId);
  try{
    const userRef = db.collection('users').doc(currentUser.uid);
    const snap = await userRef.get();
    const udata = snap.exists ? snap.data() : {};
    const salesArr = udata.sales ? JSON.parse(udata.sales) : [];
    salesArr.push({ id: 'crm_' + Date.now(), marca, cliente: lead.nome, data, valor });
    await userRef.set({ sales: JSON.stringify(salesArr) }, {merge:true});
    await db.collection('leads').doc(leadId).set({ convertidoEmVenda: true }, {merge:true});
    closeZoom('convertOverlay');
    showToast('Venda criada no CotaFlow!');
    loadLeads();
  }catch(e){
    showToast('Erro ao converter: ' + e.message);
  }
}

  const lead = leads.find(l=>l.id===leadId);
  const notas = lead.notas || [];

    await db.collection('leads').doc(leadId).set({ notas, atualizadoEm: new Date().toISOString() }, {merge:true});

    showToast('Anotação adicionada');

    openLeadDetail(leadId);

}

function setSimReducao(v){
  simState.reducao = v;
  document.querySelectorAll('#simReducaoOpts .sim-opt').forEach(el=>el.classList.toggle('active', String(el.dataset.v)===String(v)));
}
function setSimLance(v){
  simState.lance = v;
  document.querySelectorAll('#simLanceOpts .sim-opt').forEach(el=>el.classList.toggle('active', String(el.dataset.v)===String(v)));
  document.getElementById('simLanceLivreFields').classList.toggle('hide', v!=='livre');
}
function setSimDiluicao(v){
  simState.diluicao = v;
  document.querySelectorAll('#simDiluicaoOpts .sim-opt').forEach(el=>el.classList.toggle('active', el.dataset.v===v));
}

function calcularSimulacao(){
  const credito = parseFloat(document.getElementById('simCredito').value) || 0;
  const prazoTotal = parseInt(document.getElementById('simPrazo').value) || 0;
  const parcelaCheia = parseFloat(document.getElementById('simParcelaCheia').value) || 0;
  const mesContemplacao = parseInt(document.getElementById('simMesContemplacao').value) || 1;

  if(!credito || !prazoTotal || !parcelaCheia){
    showToast('Preencha crédito, prazo e parcela cheia');
    return;
  }

  const parcelaReduzida = parcelaCheia * (1 - simState.reducao/100);

  let lancePercent, embutidoPercent, propriosPercent;
  if(simState.lance === 25){ lancePercent = 25; embutidoPercent = 25; propriosPercent = 0; }
  else if(simState.lance === 50){ lancePercent = 50; embutidoPercent = 25; propriosPercent = 25; }
  else {
    embutidoPercent = parseFloat(document.getElementById('simLivreEmbutido').value) || 0;
    propriosPercent = parseFloat(document.getElementById('simLivreProprio').value) || 0;
    lancePercent = embutidoPercent + propriosPercent;
  }

  const lanceValor = credito * (lancePercent/100);
  const embutidoValor = credito * (embutidoPercent/100);
  const propriosValor = credito * (propriosPercent/100);

  const mesesRestantes = Math.max(prazoTotal - mesContemplacao, 1);
  const saldoAntesLance = mesesRestantes * parcelaCheia;
  const saldoAposLance = Math.max(saldoAntesLance - lanceValor, 0);

  let parcelaFinal, prazoFinal;
  if(simState.diluicao === 'parcela'){
    parcelaFinal = saldoAposLance / mesesRestantes;
    prazoFinal = mesesRestantes;
  } else {
    parcelaFinal = parcelaCheia;
    prazoFinal = Math.ceil(saldoAposLance / parcelaCheia);
  }

  window._simUltimoCalculo = {
    credito, prazoTotal, parcelaCheia, parcelaReduzida, reducaoPercent: simState.reducao,
    mesContemplacao, lancePercent, embutidoPercent, propriosPercent, lanceValor, embutidoValor, propriosValor,
    diluicao: simState.diluicao, parcelaFinal, prazoFinal
  };

  renderSimResultado(window._simUltimoCalculo);
  gerarTextoSimulacao(window._simUltimoCalculo);
}

function renderSimResultado(c){
  const box = document.getElementById('simResultBox');
  box.innerHTML = `
    <div class="sim-result">
      ${c.reducaoPercent>0 ? `<div class="sr-row"><span>Parcela reduzida (${c.reducaoPercent}%) até contemplar</span><b class="num">${fmtMoney(c.parcelaReduzida)}</b></div>` : ''}
      <div class="sr-row"><span>Lance total (${c.lancePercent}%)</span><b class="num">${fmtMoney(c.lanceValor)}</b></div>
      ${c.embutidoValor>0 ? `<div class="sr-row"><span>— Embutido (${c.embutidoPercent}%)</span><b class="num">${fmtMoney(c.embutidoValor)}</b></div>` : ''}
      ${c.propriosValor>0 ? `<div class="sr-row"><span>— Recursos próprios (${c.propriosPercent}%)</span><b class="num">${fmtMoney(c.propriosValor)}</b></div>` : ''}
      <div class="sr-final"><span>${c.diluicao==='parcela' ? 'Parcela pós-contemplação' : 'Prazo restante pós-contemplação'}</span><span class="num">${c.diluicao==='parcela' ? fmtMoney(c.parcelaFinal) : c.prazoFinal + ' meses'}</span></div>

}

function gerarTextoSimulacao(c){
  const lead = leads.find(l=>l.id===simState.leadId) || (window._teamLeadsCache||[]).find(l=>l.id===simState.leadId) || {};
  const marcaSel = document.getElementById('simMarca').value;
  const marcaNome = (userBrandConfig[marcaSel] && userBrandConfig[marcaSel].name) || '';

  let txt = `SIMULAÇÃO DE CONSÓRCIO${marcaNome ? ' — ' + marcaNome.toUpperCase() : ''}\n\n`;
  txt += `Crédito: ${fmtMoney(c.credito)}\n`;
  txt += `Prazo: ${c.prazoTotal} meses\n`;
  txt += `Parcela cheia: ${fmtMoney(c.parcelaCheia)}\n`;
  if(c.reducaoPercent>0){
    txt += `Parcela reduzida (${c.reducaoPercent}%) até a contemplação: ${fmtMoney(c.parcelaReduzida)}\n`;
  }
  txt += `\nLance na contemplação (mês ${c.mesContemplacao}): ${fmtMoney(c.lanceValor)} (${c.lancePercent}%)\n`;
  if(c.embutidoValor>0) txt += `— Embutido (descontado da carta): ${fmtMoney(c.embutidoValor)}\n`;
  if(c.propriosValor>0) txt += `— Recursos próprios: ${fmtMoney(c.propriosValor)}\n`;
  txt += `\n`;
  if(c.diluicao === 'parcela'){
    txt += `Após a contemplação, o saldo é diluído reduzindo a parcela:\nParcela pós-contemplação: ${fmtMoney(c.parcelaFinal)} (mantendo os ${c.prazoFinal} meses restantes)\n`;
  } else {
    txt += `Após a contemplação, o saldo é diluído reduzindo o prazo:\nParcela pós-contemplação: ${fmtMoney(c.parcelaCheia)} por ${c.prazoFinal} meses restantes\n`;
  }
  txt += `\nSimulação sujeita a alteração conforme tabela vigente da administradora.`;

  document.getElementById('simTextoOut').value = txt;
  document.getElementById('simOutBox').classList.remove('hide');
}

function roundRectSim(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function baixarSimImagem(){
  const c = window._simUltimoCalculo;
  if(!c) return;
  const lead = leads.find(l=>l.id===simState.leadId) || (window._teamLeadsCache||[]).find(l=>l.id===simState.leadId) || {};
  const marcaSel = document.getElementById('simMarca').value;
  const marcaNome = (userBrandConfig[marcaSel] && userBrandConfig[marcaSel].name) || '';

  document.fonts.ready.then(() => {
    const W = 900, H = 1000;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#F5F6F9'; ctx.fillRect(0,0,W,H);

    ctx.fillStyle = '#1E3A8A'; ctx.fillRect(0,0,W,150);
    ctx.fillStyle = '#fff'; ctx.font = '700 32px Inter, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('SIMULAÇÃO DE CONSÓRCIO', W/2, 60);
    ctx.font = '500 18px Inter, sans-serif'; ctx.fillStyle = '#C9D3F0';
    ctx.fillText(marcaNome ? marcaNome.toUpperCase() : 'AUTOMÓVEL', W/2, 95);
    ctx.fillText(lead.nome || '', W/2, 122);

    const cardX = 50, cardY = 190, cardW = W-100;
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#E4E7ED'; ctx.lineWidth = 2;
    roundRectSim(ctx, cardX, cardY, cardW, 620, 20); ctx.fill(); ctx.stroke();

    let y = cardY + 50;
    const line = (label, value) => {
      ctx.textAlign = 'left'; ctx.fillStyle = '#5B6470'; ctx.font = '600 14px Inter, sans-serif';
      ctx.fillText(label, cardX+30, y);
      ctx.textAlign = 'right'; ctx.fillStyle = '#12141A'; ctx.font = '700 16px Inter, sans-serif';
      ctx.fillText(value, cardX+cardW-30, y);
      y += 42;
    };

    line('Crédito', fmtMoney(c.credito));
    line('Prazo', c.prazoTotal + ' meses');
    line('Parcela cheia', fmtMoney(c.parcelaCheia));
    if(c.reducaoPercent>0) line(`Parcela reduzida (${c.reducaoPercent}%)`, fmtMoney(c.parcelaReduzida));

    y += 10;
    ctx.strokeStyle = '#E4E7ED'; ctx.beginPath(); ctx.moveTo(cardX+30,y); ctx.lineTo(cardX+cardW-30,y); ctx.stroke();
    y += 40;

    ctx.textAlign='left'; ctx.fillStyle='#12141A'; ctx.font='700 16px Inter, sans-serif';
    ctx.fillText(`Lance na contemplação (${c.lancePercent}%)`, cardX+30, y);
    ctx.textAlign='right'; ctx.fillStyle='#1E3A8A'; ctx.font='700 20px Inter, sans-serif';
    ctx.fillText(fmtMoney(c.lanceValor), cardX+cardW-30, y);
    y += 36;

    if(c.embutidoValor>0) line('— Embutido (descontado da carta)', fmtMoney(c.embutidoValor));
    if(c.propriosValor>0) line('— Recursos próprios', fmtMoney(c.propriosValor));

    y += 14;
    ctx.fillStyle = '#E4F5EE';
    roundRectSim(ctx, cardX+30, y, cardW-60, 90, 14); ctx.fill();
    ctx.fillStyle = '#1B8F6B'; ctx.textAlign='left'; ctx.font='600 13px Inter, sans-serif';
    ctx.fillText(c.diluicao==='parcela' ? 'PARCELA PÓS-CONTEMPLAÇÃO' : 'PRAZO RESTANTE PÓS-CONTEMPLAÇÃO', cardX+50, y+32);
    ctx.font='700 26px Inter, sans-serif';
    ctx.fillText(c.diluicao==='parcela' ? fmtMoney(c.parcelaFinal) : c.prazoFinal + ' meses', cardX+50, y+66);

    ctx.textAlign='center'; ctx.fillStyle='#9BA1AC'; ctx.font='500 13px Inter, sans-serif';
    ctx.fillText('Simulação sujeita a alteração conforme tabela vigente da administradora.', W/2, H-40);

    const link = document.createElement('a');
    link.download = `simulacao_${(lead.nome||'cliente').replace(/\s+/g,'_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  });
}

/* ============================================================
   ARRASTAR E SOLTAR — Pointer Events (funciona com touch e mouse)
   ============================================================ */
function leadAtualEstagio(leadId){
  const l = leads.find(x=>x.id===leadId);
  return l ? l.estagio : null;
}

function onFunilPointerDown(e){
  const card = e.target.closest('.lead-card');
  if(!card) return;
  dragState = { leadId: card.dataset.leadId, startX: e.clientX, startY: e.clientY, dragging:false, card, clone:null };
  document.addEventListener('pointermove', onFunilPointerMove);
  document.addEventListener('pointerup', onFunilPointerUp, { once:true });
}

function onFunilPointerMove(e){
  if(!dragState) return;
  const dx = e.clientX - dragState.startX;
  const dy = e.clientY - dragState.startY;
  if(!dragState.dragging && Math.hypot(dx,dy) > 10){
    dragState.dragging = true;
    const rect = dragState.card.getBoundingClientRect();
    const clone = dragState.card.cloneNode(true);
    clone.style.position = 'fixed';
    clone.style.top = rect.top + 'px';
    clone.style.left = rect.left + 'px';
    clone.style.width = rect.width + 'px';
    clone.style.zIndex = 5000;
    clone.style.pointerEvents = 'none';
    clone.style.opacity = '0.95';
    clone.style.transform = 'scale(1.04) rotate(-2deg)';
    clone.style.boxShadow = '0 22px 40px rgba(0,0,0,.28)';
    clone.style.transition = 'none';
    document.body.appendChild(clone);
    dragState.clone = clone;
    dragState.offsetX = dragState.startX - rect.left;
    dragState.offsetY = dragState.startY - rect.top;
    dragState.card.style.opacity = '0.25';
  }
  if(dragState.dragging){
    dragState.clone.style.left = (e.clientX - dragState.offsetX) + 'px';
    dragState.clone.style.top = (e.clientY - dragState.offsetY) + 'px';
    document.querySelectorAll('.funil-col').forEach(c=>c.classList.remove('drop-hover'));
    const colUnder = document.elementFromPoint(e.clientX, e.clientY)?.closest('.funil-col');
    if(colUnder) colUnder.classList.add('drop-hover');
  }
}

function onFunilPointerUp(e){
  document.removeEventListener('pointermove', onFunilPointerMove);
  if(!dragState) return;
  const wasDragging = dragState.dragging;
  const leadId = dragState.leadId;
  if(wasDragging){
    const colUnder = document.elementFromPoint(e.clientX, e.clientY)?.closest('.funil-col');
    if(dragState.card) dragState.card.style.opacity = '';
    if(dragState.clone) dragState.clone.remove();
    document.querySelectorAll('.funil-col').forEach(c=>c.classList.remove('drop-hover'));
    if(colUnder && colUnder.dataset.estagio && colUnder.dataset.estagio !== leadAtualEstagio(leadId)){
      moverEstagio(leadId, colUnder.dataset.estagio);
    }
  }
  dragState = null;
  if(!wasDragging){
    openLeadDetail(leadId);
  }
}

  const card = document.getElementById('leadsListCard');
  if(filtrados.length===0){
    card.innerHTML = emptyState('Nenhum lead aqui', 'Toque no botão + pra cadastrar seu primeiro lead.');
    return;
  }
  card.innerHTML = filtrados.map(l=>{
    const est = ESTAGIOS.find(e=>e.key===l.estagio) || ESTAGIOS[0];
    return `
      <div class="lead-row" onclick="openLeadDetail('${l.id}')">
        <div class="lead-row-avatar" style="background:${avatarColor(l.nome)}22; color:${avatarColor(l.nome)};">${(l.nome||'?').charAt(0).toUpperCase()}</div>
        <div class="lead-row-body">
          <div class="n">${escapeHtml(l.nome)}</div>
          <div class="s">${escapeHtml(l.interesse || l.telefone || 'Sem detalhes')}</div>
        </div>
        <span class="stage-pill" style="background:${est.cor}22; color:${est.cor};">${est.nome}</span>
      </div>
    `;
  }).join('');
}

function emptyState(title, sub){
  return `<div class="empty">
    <div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg></div>
    <div class="t">${title}</div><div class="s">${sub}</div>
  </div>`;
}

/* ============================================================
   EQUIPE (admin) — leads de todos os vendedores da mesma empresa
   ============================================================ */
async function loadTeamLeads(){
  if(!isAdminUser) return;
  const card = document.getElementById('equipeLeadsCard');
  card.innerHTML = `<div class="empty"><div class="spinner" style="margin:0 auto;"></div></div>`;
  try{
    const snap = await db.collection('leads').where('companyId','==', companyId).get();
    const teamLeads = [];
    snap.forEach(doc => teamLeads.push({ id: doc.id, ...doc.data() }));
    window._teamLeadsCache = teamLeads;

    if(teamLeads.length===0){
      card.innerHTML = emptyState('Nenhum lead na equipe', 'Assim que os vendedores cadastrarem leads, eles aparecem aqui.');
      return;
    }

    const porVendedor = {};
    teamLeads.forEach(l=>{
      if(!porVendedor[l.ownerId]) porVendedor[l.ownerId] = [];
      porVendedor[l.ownerId].push(l);
    });

    card.innerHTML = Object.keys(porVendedor).map(uid=>{
      const lista = porVendedor[uid];
      const ganhos = lista.filter(l=>l.estagio==='ganho').length;
      const rows = lista.map(l=>{
        const est = ESTAGIOS.find(e=>e.key===l.estagio) || ESTAGIOS[0];
        return `<div class="lead-row" onclick="openLeadDetail('${l.id}')">
          <div class="lead-row-avatar" style="background:${avatarColor(l.nome)}22; color:${avatarColor(l.nome)};">${(l.nome||'?').charAt(0).toUpperCase()}</div>
          <div class="lead-row-body"><div class="n">${escapeHtml(l.nome)}</div><div class="s">${escapeHtml(l.interesse||'')}</div></div>
          <span class="stage-pill" style="background:${est.cor}22; color:${est.cor};">${est.nome}</span>
        </div>`;
      }).join('');
      return `<div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
          <span style="font-weight:700; font-size:13px;">${escapeHtml(uid.slice(0,8))}…</span>
          <span class="hint">${lista.length} leads · ${ganhos} ganhos</span>
        </div>
        ${rows}
      </div>`;
    }).join('');
  }catch(e){
    card.innerHTML = emptyState('Erro ao carregar', 'Verifique se as regras do Firestore liberam leitura para administradores na coleção "leads".');
  }
}
